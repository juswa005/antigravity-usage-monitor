[package]
name = "antigravity-usage-monitor"
version = "0.1.0"
edition = "2021"
description = "Lightweight Antigravity CLI usage monitor with Ratatui TUI, Waybar JSON module, GitHub-style green-dot heatmap, and SQLite history"
license = "MIT"
readme = "README.md"
repository = "https://github.com/juswa005/antigravity-usage-monitor"
keywords = ["antigravity", "waybar", "tui", "ratatui", "nixos"]
categories = ["command-line-utilities"]

[lib]
name = "agmonitor"
path = "src/lib.rs"

[[bin]]
name = "agmonitor"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
vt100 = "0.15"

[package.metadata.deb]
maintainer = "Antigravity Usage Monitor Contributors"
copyright = "2026, Antigravity Usage Monitor Contributors"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
assets = [
    ["target/release/agmonitor", "usr/bin/agmonitor", "755"],
    ["config/config.toml", "usr/share/doc/agmonitor/config.toml.example", "644"],
    ["packaging/systemd/agmonitor-refresh.service", "usr/lib/systemd/user/agmonitor-refresh.service", "644"],
    ["packaging/systemd/agmonitor-refresh.timer", "usr/lib/systemd/user/agmonitor-refresh.timer", "644"],
    ["README.md", "usr/share/doc/agmonitor/README.md", "644"],
]
