# Add to ~/.config/sway/config.d/08-rules (floating centered window for TUI popup)
for_window [app_id="agmonitor"] floating enable
for_window [app_id="agmonitor"] resize set 1120 740
for_window [app_id="agmonitor"] move position center

# Optional: if using waybar-kitty for `agy` middle-click popup
for_window [app_id="waybar-kitty"] floating enable
for_window [app_id="waybar-kitty"] resize set 1000 700
for_window [app_id="waybar-kitty"] move position center

# Hyprland equivalent (if running Hyprland):
# windowrulev2 = float, class:^(agmonitor)$
# windowrulev2 = size 1120 740, class:^(agmonitor)$
# windowrulev2 = center, class:^(agmonitor)$
